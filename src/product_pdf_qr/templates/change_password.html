{% extends "base.html" %}

{% block title %}修改初始密码 · Product PDF QR{% endblock %}

{% block head %}
  <style>
    :root {
      color-scheme: light;
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      color: #172033;
      background: #eef2f7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      place-items: center;
    }

    main {
      width: min(100% - 2rem, 480px);
    }

    .card {
      padding: clamp(1.5rem, 5vw, 2.5rem);
      border: 1px solid #d7deea;
      border-radius: 0.8rem;
      background: #fff;
      box-shadow: 0 18px 45px rgb(23 32 51 / 10%);
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.55rem;
    }

    .hint {
      color: #5d687a;
    }

    .field {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 650;
    }

    input,
    button {
      width: 100%;
      min-height: 46px;
      font: inherit;
    }

    input {
      padding: 0.7rem 0.8rem;
      border: 1px solid #aeb9cb;
      border-radius: 0.5rem;
    }

    button {
      border: 0;
      border-radius: 0.5rem;
      color: #fff;
      background: #2457d6;
      cursor: pointer;
    }

    button:hover {
      background: #1d47b2;
    }

    input:focus-visible,
    button:focus-visible {
      outline: 3px solid #7aa2ff;
      outline-offset: 2px;
    }

    .error {
      padding: 0.75rem;
      border-radius: 0.5rem;
      color: #8f1d17;
      background: #fff0ee;
    }

    .logout {
      margin-top: 1.25rem;
    }

    .logout button {
      color: #1748bd;
      background: #e9efff;
    }
  </style>
{% endblock %}

{% block content %}
  <main>
    <section class="card" aria-labelledby="password-heading">
      <h1 id="password-heading">修改初始密码</h1>
      <p class="hint">
        {{ admin.username }}，继续管理产品前，请设置不同于当前密码的新密码。
        新密码至少 12 个字符。
      </p>

      {% if error %}
        <p class="error" role="alert">{{ error }}</p>
      {% endif %}

      <form action="/admin/change-password" method="post">
        <div class="field">
          <label for="current-password">当前密码</label>
          <input
            id="current-password"
            name="current_password"
            type="password"
            required
            autocomplete="current-password"
          >
        </div>
        <div class="field">
          <label for="new-password">新密码</label>
          <input
            id="new-password"
            name="new_password"
            type="password"
            required
            minlength="12"
            autocomplete="new-password"
          >
        </div>
        <div class="field">
          <label for="confirm-password">再次输入新密码</label>
          <input
            id="confirm-password"
            name="confirm_password"
            type="password"
            required
            minlength="12"
            autocomplete="new-password"
          >
        </div>
        <button type="submit">保存新密码</button>
      </form>

      <form class="logout" action="/admin/logout" method="post">
        <button type="submit">退出登录</button>
      </form>
    </section>
  </main>
{% endblock %}
