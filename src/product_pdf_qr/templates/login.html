{% extends "base.html" %}

{% block title %}管理员登录 · Product PDF QR{% endblock %}

{% block head %}
  <style>
    :root {
      color-scheme: light;
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      color: #172033;
      background: #eef2f7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      place-items: center;
    }

    main {
      width: min(100% - 2rem, 430px);
    }

    .card {
      padding: clamp(1.5rem, 5vw, 2.5rem);
      border: 1px solid #d7deea;
      border-radius: 0.8rem;
      background: #fff;
      box-shadow: 0 18px 45px rgb(23 32 51 / 10%);
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.55rem;
    }

    .hint {
      margin: 0 0 1.5rem;
      color: #5d687a;
    }

    .field {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 650;
    }

    input,
    button {
      width: 100%;
      min-height: 46px;
      font: inherit;
    }

    input {
      padding: 0.7rem 0.8rem;
      border: 1px solid #aeb9cb;
      border-radius: 0.5rem;
    }

    button {
      border: 0;
      border-radius: 0.5rem;
      color: #fff;
      background: #2457d6;
      cursor: pointer;
    }

    button:hover {
      background: #1d47b2;
    }

    input:focus-visible,
    button:focus-visible {
      outline: 3px solid #7aa2ff;
      outline-offset: 2px;
    }

    .error {
      padding: 0.75rem;
      border-radius: 0.5rem;
      color: #8f1d17;
      background: #fff0ee;
    }
  </style>
{% endblock %}

{% block content %}
  <main>
    <section class="card" aria-labelledby="login-heading">
      <h1 id="login-heading">管理员登录</h1>
      <p class="hint">登录后可管理产品、PDF 与二维码。</p>

      {% if error %}
        <p class="error" role="alert">{{ error }}</p>
      {% endif %}

      <form action="/admin/login" method="post">
        <input type="hidden" name="next" value="{{ next_path }}">
        <div class="field">
          <label for="username">用户名</label>
          <input
            id="username"
            name="username"
            required
            maxlength="64"
            autocomplete="username"
            autofocus
          >
        </div>
        <div class="field">
          <label for="password">密码</label>
          <input
            id="password"
            name="password"
            type="password"
            required
            autocomplete="current-password"
          >
        </div>
        <button type="submit">登录</button>
      </form>
    </section>
  </main>
{% endblock %}
