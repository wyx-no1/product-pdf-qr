worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/cache/nginx/error.log crit;

events {
    worker_connections 1024;
    multi_accept off;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format token_safe
        '$remote_addr request_id=$request_id time=$time_iso8601 '
        'method=$request_method status=$status bytes=$body_bytes_sent '
        'server=$server_name';
    access_log /var/cache/nginx/access.log token_safe;

    server_tokens off;
    autoindex off;

    # G-02 transport constants: all values are explicit; no Nginx defaults.
    client_header_timeout 10s;
    client_body_timeout 15s;
    client_body_buffer_size 128k;
    client_body_temp_path /tmp/client_body 1 2;
    send_timeout 60s;
    keepalive_timeout 30s;
    keepalive_requests 100;
    reset_timedout_connection on;

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering off;
    proxy_request_buffering on;
    proxy_max_temp_file_size 0;
    proxy_cache off;

    limit_req_zone $binary_remote_addr zone=public_scan:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=admin_login:10m rate=30r/m;
    limit_req_status 429;
    limit_req_log_level notice;

    include /etc/nginx/conf.d/*.conf;
}
