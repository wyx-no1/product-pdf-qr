[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "product-pdf-qr"
version = "0.1.0"
description = "Product PDF QR application foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.18.5",
  "fastapi==0.141.1",
  "jinja2==3.1.6",
  "psycopg[binary,pool]==3.3.4",
  "pydantic-settings==2.14.2",
  "sqlalchemy==2.0.51",
  "uvicorn==0.52.0",
]

[dependency-groups]
dev = [
  "bandit==1.9.4",
  "build==1.5.0",
  "httpx==0.28.1",
  "mypy==2.3.0",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
product_pdf_qr = ["templates/*.html"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "api: API contract tests",
  "e2e: end-to-end business-flow tests",
  "integration: tests that require the isolated PostgreSQL test database",
]

[tool.coverage.run]
branch = true
source = ["product_pdf_qr"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
junit_xml = "reports/mypy.xml"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
